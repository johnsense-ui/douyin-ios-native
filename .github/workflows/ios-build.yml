name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          xcodebuild -version
          pwd
          ls -la

      - name: 工程信息
        run: |
          xcodebuild -list -project DouyinLocal.xcodeproj 2>&1

      - name: 编译
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project DouyinLocal.xcodeproj \
            -scheme DouyinLocal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log | tail -100
          echo "xcodebuild exit=${PIPESTATUS[0]}"

      - name: 提取错误
        if: always()
        run: |
          {
            echo "## 编译诊断"
            echo '```'
            echo "=== build/ 结构 ==="
            ls -la build 2>&1 || echo "build/ 不存在"
            ls -la build/Build/Products 2>&1 || echo "Products 不存在"
            echo
            echo "=== 日志行数 ==="
            wc -l build.log 2>&1 || echo "build.log 不存在"
            echo
            echo "=== BUILD 结果 ==="
            grep -E "BUILD (SUCCEEDED|FAILED)" build.log 2>&1 | tail -3 || echo "无 BUILD 行"
            echo
            echo "=== error: 行 ==="
            grep -n "error:" build.log 2>&1 | head -40 || echo "(无)"
            echo
            echo "=== 尾部 40 行 ==="
            tail -40 build.log 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: warn

      - name: 打包 IPA
        run: |
          set -e
          echo "===== build/ 目录 ====="
          ls -la build 2>&1 || true
          echo "===== 查找 .app ====="
          find build -name "*.app" -maxdepth 6 2>&1 || true
          echo "===== 查找 .xcarchive ====="
          find build -name "*.xcarchive" -maxdepth 4 2>&1 || true
          APP=$(find build -name "*.app" -maxdepth 6 2>/dev/null | head -1)
          echo "APP=[$APP]"
          if [ -z "$APP" ]; then
            echo "!! 没有找到 .app，编译未产出产物"
            exit 1
          fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          ( cd out && zip -qry ../DouyinLocal-unsigned.ipa Payload )
          ls -lh DouyinLocal-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLocal-ipa
          path: DouyinLocal-unsigned.ipa
          retention-days: 30
