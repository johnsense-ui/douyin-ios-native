name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 1-环境与结构
        run: |
          set -e
          xcodebuild -version
          echo "PWD=$(pwd)"
          ls -la
          echo "--- xcodeproj ---"
          ls -la DouyinLocal.xcodeproj
          echo "--- schemes ---"
          ls -la DouyinLocal.xcodeproj/xcshareddata/xcschemes || true

      - name: 2-xcodebuild -list
        run: |
          set -e
          xcodebuild -list -project DouyinLocal.xcodeproj 2>&1 | tee list.txt
          echo "----- 是否有 DouyinLocal scheme -----"
          grep -q "DouyinLocal" list.txt || (echo "!! scheme 未识别"; exit 1)

      - name: 3-真正编译
        run: |
          set -o pipefail
          xcodebuild \
            -project DouyinLocal.xcodeproj \
            -scheme DouyinLocal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "xcodebuild rc=$rc"
          exit $rc

      - name: 4-检查产物
        run: |
          set -e
          echo "=== build 树（2 层）==="
          ls -la build || true
          ls -la build/Build 2>/dev/null || true
          ls -la build/Build/Products 2>/dev/null || true
          echo "=== 所有 .app ==="
          find build -name "*.app" | head
          N=$(find build -name "*.app" | wc -l)
          echo "找到 $N 个 .app"
          [ "$N" -ge 1 ] || (echo "!! 没有产物"; exit 1)

      - name: 5-打包 IPA
        run: |
          set -e
          APP=$(find build -name "*.app" | head -1)
          echo "APP=$APP"
          du -sh "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          du -sh out/Payload
          ( cd out && zip -qry ../DouyinLocal-unsigned.ipa Payload )
          ls -lh DouyinLocal-unsigned.ipa

      - name: 6-上传
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLocal-ipa
          path: DouyinLocal-unsigned.ipa
          retention-days: 30

      - name: 7-上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            list.txt
          retention-days: 14
          if-no-files-found: warn
