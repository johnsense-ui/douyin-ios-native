name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          xcodebuild -version

      - name: 编译并提取错误
        run: |
          cd swift
          set +e
          xcodebuild build \
            -project DouyinLocal.xcodeproj \
            -scheme DouyinLocal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            > build.log 2>&1
          rc=$?
          echo "exit=$rc"
          echo "===================== ERRORS ====================="
          grep -n "error:" build.log | head -40 || echo "(无 error: 行)"
          echo "===================== FAILED CMD ================="
          grep -n -A6 "The following build commands failed" build.log | head -30 || true
          echo "===================== LAST 40 ===================="
          tail -40 build.log
          # 把精简日志写进 artifact 之外的固定名字
          grep -n "error:" build.log > errors.txt || true
          tail -200 build.log > tail.txt || true
          exit $rc

      - name: 上传错误日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            swift/errors.txt
            swift/tail.txt
            swift/build.log
          retention-days: 14
          if-no-files-found: warn

      - name: 打包 unsigned IPA
        run: |
          set -e
          cd swift
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../DouyinLocal-unsigned.ipa Payload
          ls -lh ../DouyinLocal-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLocal-ipa
          path: swift/DouyinLocal-unsigned.ipa
          retention-days: 30
