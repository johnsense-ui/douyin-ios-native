name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 显示环境
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: 校验工程结构
        run: |
          cd swift
          ls -la
          echo "--- sources ---"
          find DouyinLocal -name "*.swift" | sort
          echo "--- list ---"
          xcodebuild -list -project DouyinLocal.xcodeproj

      - name: 编译（不签名）
        run: |
          set -o pipefail
          cd swift
          mkdir -p build
          xcodebuild build \
            -project DouyinLocal.xcodeproj \
            -scheme DouyinLocal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log | tail -80

      - name: 打包 unsigned IPA
        run: |
          set -e
          cd swift
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "找不到 .app"; exit 1; fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../DouyinLocal-unsigned.ipa Payload
          ls -lh ../DouyinLocal-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLocal-ipa
          path: swift/DouyinLocal-unsigned.ipa
          retention-days: 30

      - name: 上传编译日志（总是）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: swift/build.log
          retention-days: 14
          if-no-files-found: warn
