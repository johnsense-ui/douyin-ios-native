name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          xcodebuild -version
          sw_vers

      - name: 工程诊断（不阻断）
        continue-on-error: true
        run: |
          cd swift
          echo "=== files ==="
          ls -R | head -50
          echo "=== xcodebuild -list ==="
          xcodebuild -list -project DouyinLocal.xcodeproj
          echo "=== plutil ==="
          plutil -lint DouyinLocal.xcodeproj/project.pbxproj

      - name: 编译（不签名）
        run: |
          cd swift
          xcodebuild build \
            -project DouyinLocal.xcodeproj \
            -scheme DouyinLocal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -150

      - name: 打包 unsigned IPA
        run: |
          set -e
          cd swift
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../DouyinLocal-unsigned.ipa Payload
          ls -lh ../DouyinLocal-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLocal-ipa
          path: swift/DouyinLocal-unsigned.ipa
          retention-days: 30
