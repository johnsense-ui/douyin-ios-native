name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      note:
        description: "构建说明"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 显示环境
        run: |
          xcodebuild -version
          xcodebuild -showsdks | head -20

      - name: 编译（不签名）
        run: |
          set -o pipefail
          cd swift
          xcodebuild \
            -project DouyinLocal.xcodeproj \
            -scheme DouyinLocal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/DouyinLocal.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee build.log | tail -60

      - name: 打包 unsigned IPA
        run: |
          set -e
          cd swift
          APP=$(find build/DouyinLocal.xcarchive/Products/Applications -maxdepth 1 -name "*.app")
          echo "APP=$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../DouyinLocal-unsigned.ipa Payload
          ls -lh ../DouyinLocal-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLocal-ipa
          path: swift/DouyinLocal-unsigned.ipa
          retention-days: 30

      - name: 编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: swift/build.log
          retention-days: 7
